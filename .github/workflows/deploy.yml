name: Deploy RES Logistics

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /www/wwwroot/res

            git fetch origin main
            git reset --hard origin/main

            # Ensure logistics grid images exist after pull
            ls -la public/img/logistics-grid-*.png

            rm -rf .next
            npm ci
            npm run build

            # Verify built output can see public assets
            test -f public/img/logistics-grid-1.png
            test -f public/img/logistics-grid-2.png
            test -f public/img/logistics-grid-3.png
            test -f public/img/logistics-grid-4.png
            test -f public/img/logistics-grid-5.png
            test -f public/img/logistics-grid-6.png

            pm2 restart res || pm2 start npm --name res -- start
            pm2 save
