```yaml
name: Deploy RES Logistics

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            set -euo pipefail

            echo "==> Starting RES Logistics deployment"

            sudo -n /usr/local/sbin/res-deploy

            echo "==> Checking RES Logistics response"

            if ! curl -fsS --max-time 20 http://127.0.0.1:6001/ -o /dev/null; then
              echo "ERROR: RES did not respond successfully on port 6001"
              exit 1
            fi

            echo "==> RES Logistics deployment and health check succeeded"
```