name: Deploy RES Logistics

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /www/wwwroot/res

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            pm2 restart res || pm2 start npm --name res -- start
